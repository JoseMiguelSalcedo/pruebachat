spring.application.name=pruebachat
server.port=8080

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}

spring.ai.ollama.chat.model=qwen2.5:3b
spring.ai.ollama.chat.temperature=0.0
spring.ai.ollama.chat.options.model=${spring.ai.ollama.chat.model}
spring.ai.ollama.chat.options.temperature=${spring.ai.ollama.chat.temperature}

spring.http.client.read-timeout=300s

logging.level.org.springframework.ai=DEBUG
logging.level.com.example.chat=INFO
