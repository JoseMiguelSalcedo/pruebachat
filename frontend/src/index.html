<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pruebachat - Spring AI + Ollama</title>
  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --border:#334155; --text:#f8fafc; --muted:#94a3b8; --accent:#38bdf8; --user:#2563eb; --bot:#334155; --ok:#22c55e; --err:#ef4444; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; height:100vh; }
    header { padding:14px 20px; background:var(--panel); border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
    header h1 { margin:0; font-size:1.1rem; }
    .status-bar { display:flex; align-items:center; gap:10px; font-size:0.85rem; }
    .pill { display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:999px; background:#0f172a; border:1px solid var(--border); }
    .dot { width:9px; height:9px; border-radius:50%; background:var(--muted); }
    .dot.ok { background:var(--ok); }
    .dot.err { background:var(--err); }
    #messages { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px; max-width:900px; width:100%; margin:0 auto; }
    .msg { max-width:82%; padding:12px 16px; border-radius:14px; line-height:1.45; white-space:pre-wrap; word-wrap:break-word; }
    .msg.user { align-self:flex-end; background:var(--user); border-bottom-right-radius:4px; }
    .msg.bot { align-self:flex-start; background:var(--bot); border-bottom-left-radius:4px; }
    .meta { margin-top:6px; font-size:0.75rem; color:var(--muted); }
    form { padding:14px 20px; background:var(--panel); border-top:1px solid var(--border); display:flex; gap:10px; max-width:900px; width:100%; margin:0 auto; }
    input[type="text"] { flex:1; padding:12px 14px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:0.95rem; outline:none; }
    button { padding:10px 18px; border:none; border-radius:10px; background:var(--accent); color:#0f172a; font-weight:600; cursor:pointer; }
    button:disabled { opacity:0.5; cursor:not-allowed; }
    .btn-sec { background:transparent; color:var(--muted); border:1px solid var(--border); padding:5px 10px; font-size:0.8rem; }
  </style>
</head>
<body>
  <header>
    <h1>pruebachat - Asistente Spring AI + Ollama</h1>
    <div class="status-bar">
      <span class="pill"><span id="statusDot" class="dot"></span><span id="statusText">verificando...</span></span>
      <button type="button" class="btn-sec" id="newSessionBtn">Nueva sesion</button>
    </div>
  </header>
  <main id="messages"></main>
  <form id="chatForm">
    <input id="questionInput" type="text" placeholder="Escribe tu pregunta aqui..." autocomplete="off" required />
    <button id="sendBtn" type="submit">Enviar</button>
  </form>
  <script>
    const TIMEOUT_MS = 300000;
    const API_URL = '/api/v1/chat';
    const STATUS_URL = '/api/v1/status';
    let sessionId = crypto.randomUUID ? crypto.randomUUID() : 'sess-' + Date.now();
    const messagesEl = document.getElementById('messages');
    const formEl = document.getElementById('chatForm');
    const inputEl = document.getElementById('questionInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    function addMessage(text, role, metaText) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.textContent = text;
      if (metaText) {
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = metaText;
        div.appendChild(meta);
      }
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    async function checkStatus() {
      try {
        const res = await fetch(STATUS_URL);
        const data = await res.json();
        statusDot.className = 'dot ' + (data.active ? 'ok' : 'err');
        statusText.textContent = data.status + ' (' + data.model + ') - ' + data.service;
      } catch (e) {
        statusDot.className = 'dot err';
        statusText.textContent = 'backend desconectado';
      }
    }

    document.getElementById('newSessionBtn').addEventListener('click', function() {
      sessionId = crypto.randomUUID ? crypto.randomUUID() : 'sess-' + Date.now();
      messagesEl.innerHTML = '';
      addMessage('Nueva sesion iniciada.', 'bot');
    });

    formEl.addEventListener('submit', async function(e) {
      e.preventDefault();
      const question = inputEl.value.trim();
      if (!question) return;
      addMessage(question, 'user');
      inputEl.value = '';
      sendBtn.disabled = true;
      const loadingEl = addMessage('Procesando...', 'bot');
      const controller = new AbortController();
      const timer = setTimeout(function() { controller.abort(); }, TIMEOUT_MS);
      const t0 = performance.now();
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: question, sessionId: sessionId }),
          signal: controller.signal
        });
        clearTimeout(timer);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const secs = ((performance.now() - t0) / 1000).toFixed(2);
        loadingEl.textContent = data.answer || '(sin respuesta)';
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = 'Tiempo: ' + secs + ' s - Sesion: ' + sessionId.slice(0, 8);
        loadingEl.appendChild(meta);
      } catch (err) {
        clearTimeout(timer);
        loadingEl.textContent = err.name === 'AbortError'
          ? 'Tiempo de espera agotado (' + (TIMEOUT_MS / 1000) + ' s).'
          : 'Error al consultar el backend: ' + err.message;
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    });

    checkStatus();
    setInterval(checkStatus, 10000);
  </script>
</body>
</html>
