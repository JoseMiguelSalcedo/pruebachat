services:
  ollama:
    image: ollama/ollama:latest
    container_name: pruebachat_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    container_name: pruebachat_ollama_pull
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    command: ["pull", "qwen2.5:3b"]
    restart: on-failure

  backend:
    build:
      context: ../backend
    container_name: pruebachat_backend
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    container_name: pruebachat_frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
